[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = false
files = [
  "utils.py",
  "validation.py",
  "tfjs_export.py",
  "trainer_logic.py",
  "job_hmac.py",
  "main.py",
]
