services:
  lsv-api:
    build:
      context: ./lsv-backend
      target: development
    restart: unless-stopped
    depends_on:
      - lsv-db
      - lsv-valkey
    env_file:
      - ./.env
    environment:
      - DB_HOST=lsv-db
    networks:
      - lsv_network
    volumes:
      - lsv_shared_data:/src/app/shared
    ports:
      - "3000:3000"

  lsv-frontend:
    build:
      context: ./lsv-frontend
      target: development
    restart: unless-stopped
    ports:
      - "8080:5173"
    volumes:
      - ./lsv-frontend:/app
      - /app/node_modules
    env_file:
      - ./.env
    networks:
      - lsv_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  lsv-valkey:
    image: valkey/valkey:8.0-alpine
    restart: unless-stopped
    networks:
      - lsv_network
    volumes:
      - valkey_data:/data
    command: valkey-server --save 60 1 --loglevel warning --requirepass ${VALKEY_PASSWORD:-password}

  lsv-db:
    image: postgres:18.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
    env_file:
      - ./.env
    volumes:
      - db_data_psql:/var/lib/postgresql
      - ./lsv-backend/init-db:/docker-entrypoint-initdb.d
    networks:
      - lsv_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  lsv-model-trainer:
    build:
      context: ./lsv-model-trainer
    restart: unless-stopped
    depends_on:
      - lsv-valkey
    env_file:
      - ./.env
    volumes:
      - lsv_shared_data:/shared
      - ./lsv-model-trainer:/app
    networks:
      - lsv_network
    deploy:
      resources:
        limits:
          cpus: '1.0'

networks:
  lsv_network:
    external: true
    name: web-proxy

volumes:
  db_data_psql:
  valkey_data:
  lsv_shared_data:
