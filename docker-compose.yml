services:
  lsv-api:
    build:
      context: ./lsv-backend
      target: development
    restart: unless-stopped
    depends_on:
      - lsv-db
      - lsv-valkey
    env_file:
      - ./.env
    environment:
      - DB_HOST=lsv-db
      - SHARED_DATA_DIR=/src/app/shared
      - WORKER_SHARED_DATA_DIR=/shared
      - TRAINER_JOB_SECRET=${TRAINER_JOB_SECRET:-${JWT_SECRET}}
    networks:
      - lsv_network
    volumes:
      - lsv_shared_data:/src/app/shared
    ports:
      - "3000:3000"

  lsv-frontend:
    build:
      context: ./lsv-frontend
      target: development
    restart: unless-stopped
    ports:
      - "8080:5173"
    volumes:
      - ./lsv-frontend:/app
      - /app/node_modules
    env_file:
      - ./.env
    environment:
      # Root .env may set NODE_ENV=production; keep Vite in development mode.
      - NODE_ENV=development
      # From inside the compose network, proxy /api to the API service.
      - VITE_API_PROXY_TARGET=http://lsv-api:3000
      # Browser hits localhost:8080 (mapped to Vite 5173); HMR WS must use 8080.
      - VITE_HMR_CLIENT_PORT=8080
    networks:
      - lsv_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  lsv-valkey:
    image: valkey/valkey:8.0-alpine
    restart: unless-stopped
    networks:
      - lsv_network
    volumes:
      - valkey_data:/data
    command: valkey-server --save 60 1 --loglevel warning --requirepass ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}

  lsv-db:
    image: postgres:18.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
    env_file:
      - ./.env
    volumes:
      - db_data_psql:/var/lib/postgresql
      - ./lsv-backend/init-db:/docker-entrypoint-initdb.d
    networks:
      - lsv_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  lsv-model-trainer:
    build:
      context: ./lsv-model-trainer
    restart: unless-stopped
    depends_on:
      - lsv-valkey
    # Valkey + HMAC de jobs. TRAINER_JOB_SECRET cae a JWT_SECRET si no se define.
    environment:
      VALKEY_HOST: ${VALKEY_HOST:-lsv-valkey}
      VALKEY_PORT: ${VALKEY_PORT:-6379}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
      DATA_BASE_DIR: /shared
      TRAINER_HEALTH_PORT: "8089"
      TRAINER_JOB_SECRET: "${TRAINER_JOB_SECRET:-${JWT_SECRET}}"
    # El fit puede durar minutos; con los 10s por defecto Docker mata el job a
    # mitad y queda stalled en BullMQ.
    stop_grace_period: 60s
    volumes:
      - lsv_shared_data:/shared
    networks:
      - lsv_network
    expose:
      - "8089"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

networks:
  lsv_network:
    external: true
    name: web-proxy

volumes:
  db_data_psql:
  valkey_data:
  lsv_shared_data:
