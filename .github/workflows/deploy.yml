name: Build and Deploy LSV (Full Stack)

on:
  push:
    branches:
      - main
  # INF-06: redeploy manual. Con `tag` se despliega una imagen ya publicada (rollback)
  # sin CI ni build; sin `tag` se hace el flujo completo sobre la rama elegida.
  workflow_dispatch:
    inputs:
      tag:
        description: "SHA completo (40 caracteres) de imágenes ya publicadas en GHCR. Vacío = CI + build + deploy de la rama elegida."
        required: false
        default: ""
        type: string

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: quijadajose/lsv-backend
  FRONTEND_IMAGE: quijadajose/lsv-frontend
  TRAINER_IMAGE: quijadajose/lsv-model-trainer
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # INF-06: el deploy solo sale si pasa toda la CI (lint, unit, e2e completo,
  # frontend, trainer y contrato ML).
  ci:
    if: github.event_name == 'push' || inputs.tag == ''
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    if: github.event_name == 'push' || inputs.tag == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # INF-06: el SHA es la etiqueta que se despliega; latest queda solo como referencia.
      - name: Build and push Backend
        uses: docker/build-push-action@v7
        with:
          context: ./lsv-backend
          target: production
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./lsv-frontend
          push: true
          build-args: |
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Build and push Model Trainer
        uses: docker/build-push-action@v7
        with:
          context: ./lsv-model-trainer
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.TRAINER_IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.TRAINER_IMAGE }}:${{ github.sha }}

  deploy:
    needs: build
    # build se salta solo en un redeploy manual con `tag`; si falló o se saltó
    # por un fallo de CI, no se despliega.
    if: >-
      ${{ !cancelled() && (
        needs.build.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.tag != '' && needs.build.result == 'skipped')
      ) }}
    runs-on: ubuntu-latest
    # Nunca dos deploys a la vez sobre el mismo servidor.
    concurrency:
      group: lsv-production-deploy
      cancel-in-progress: false
    env:
      IMAGE_TAG: ${{ inputs.tag || github.sha }}
    steps:
      - name: Validate image tag
        run: |
          if ! [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "IMAGE_TAG inválido: se espera el SHA completo de 40 caracteres" >&2
            exit 1
          fi
          echo "Desplegando $IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout repository
        uses: actions/checkout@v4

      # INF-06: actions de terceros fijadas por SHA (v0.1.7 y v1.0.3).
      - name: Copy docker-compose files to server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml,Caddyfile,scripts/deploy.sh"
          target: "~/apps/lsv"

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG
          script: |
            set -eu
            cd ~/apps/lsv

            # INF-07: el token no aparece en la línea de comandos ni en el historial.
            # Para despliegues fuera de Actions conviene un PAT de solo lectura (read:packages).
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # INF-06: pull de la etiqueta, backup de la BD, up y registro de la
            # etiqueta anterior para el rollback (docs/deploy-rollback.md).
            bash scripts/deploy.sh deploy "$IMAGE_TAG"
