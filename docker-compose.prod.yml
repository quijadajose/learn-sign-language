services:
  lsv-api:
    image: ghcr.io/quijadajose/lsv-backend:${IMAGE_TAG:-latest}
    command: npm run start:prod
    environment:
      - SENTRY_DSN=${SENTRY_DSN}
      - SHARED_DATA_DIR=/src/app/shared
      - WORKER_SHARED_DATA_DIR=/shared
      - TRAINER_JOB_SECRET=${TRAINER_JOB_SECRET:?TRAINER_JOB_SECRET es obligatorio y distinto de JWT_SECRET}
    volumes:
      - lsv_shared_data:/src/app/shared
      - lsv_uploads:/src/app/uploads
    expose:
      - "3000"

  lsv-frontend:
    image: ghcr.io/quijadajose/lsv-frontend:${IMAGE_TAG:-latest}
    expose:
      - "80"
    networks:
      - web-proxy

  lsv-model-trainer:
    image: ghcr.io/quijadajose/lsv-model-trainer:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - lsv-valkey
    # Valkey + HMAC de jobs. TRAINER_JOB_SECRET es obligatorio (sin fallback a JWT_SECRET).
    environment:
      VALKEY_HOST: ${VALKEY_HOST:-lsv-valkey}
      VALKEY_PORT: ${VALKEY_PORT:-6379}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
      DATA_BASE_DIR: /shared
      TRAINER_HEALTH_PORT: "8089"
      TRAINER_JOB_SECRET: "${TRAINER_JOB_SECRET:?TRAINER_JOB_SECRET es obligatorio y distinto de JWT_SECRET}"
    # El fit puede durar minutos; con los 10s por defecto Docker mata el job a
    # mitad y queda stalled en BullMQ.
    stop_grace_period: 60s
    volumes:
      - lsv_shared_data:/shared
    networks:
      - lsv_internal
    expose:
      - "8089"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 2G

volumes:
  lsv_uploads:
