services:
  lsv-api:
    image: ghcr.io/quijadajose/lsv-backend:latest
    command: npm run start:prod
    environment:
      - SENTRY_DSN=${SENTRY_DSN}
      - SHARED_DATA_DIR=/src/app/shared
      - WORKER_SHARED_DATA_DIR=/shared
    volumes:
      - lsv_shared_data:/src/app/shared
    expose:
      - "3000"

  lsv-frontend:
    image: ghcr.io/quijadajose/lsv-frontend:latest
    expose:
      - "80"

  lsv-model-trainer:
    image: ghcr.io/quijadajose/lsv-model-trainer:latest
    restart: unless-stopped
    depends_on:
      - lsv-valkey
    # Solo necesita Valkey: no se le pasa el .env completo (DB, JWT, OAuth).
    environment:
      VALKEY_HOST: ${VALKEY_HOST:-lsv-valkey}
      VALKEY_PORT: ${VALKEY_PORT:-6379}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
      DATA_BASE_DIR: /shared
      TRAINER_HEALTH_PORT: "8089"
    # El fit puede durar minutos; con los 10s por defecto Docker mata el job a
    # mitad y queda stalled en BullMQ.
    stop_grace_period: 60s
    volumes:
      - lsv_shared_data:/shared
    networks:
      - lsv_network
    expose:
      - "8089"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 2G

volumes:
  db_data_psql:
  valkey_data:
  lsv_shared_data:
